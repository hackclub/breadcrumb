name: Breadcrumb
options:
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: "Developer ID Application"
    CODE_SIGN_STYLE: Manual
packages:
  BreadcrumbPackage:
    path: .
targets:
  BreadcrumbApp:
    type: application
    platform: macOS
    sources: [Sources/Breadcrumb]
    dependencies:
      - package: BreadcrumbPackage
        product: BreadcrumbCore
      - package: BreadcrumbPackage
        product: BreadcrumbCaptureSupport
    settings:
      base:
        PRODUCT_NAME: Breadcrumb
        PRODUCT_MODULE_NAME: BreadcrumbApp
        PRODUCT_BUNDLE_IDENTIFIER: app.rewind.local
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
  BreadcrumbUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: BreadcrumbApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.rewind.local.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Breadcrumb:
    build:
      targets:
        BreadcrumbApp: all
    test:
      targets: [BreadcrumbUITests]
      captureScreenshotsAutomatically: true
      deleteScreenshotsWhenEachTestSucceeds: false
      preferredScreenCaptureFormat: screenRecording
