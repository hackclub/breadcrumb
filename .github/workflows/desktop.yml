name: Desktop
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  engine:
    name: Local engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: engine/go.mod
          cache: false
      - if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" && go vet ./...
        working-directory: engine
      - run: go test -race ./...
        working-directory: engine
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: Linux, target: "" }
          - { os: windows-latest, name: Windows, target: "" }
          - { os: macos-latest, name: "macOS Apple Silicon", target: aarch64-apple-darwin }
          - { os: macos-26-intel, name: "macOS Intel", target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            native/capture
            desktop/src-tauri
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: engine/go.mod
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxcb1-dev libxcb-randr0-dev libxcb-xfixes0-dev libxss1 libdbus-1-dev libpipewire-0.3-dev libgbm-dev libclang-dev libwayland-dev libxkbcommon-dev xvfb openbox xterm dbus-x11 at-spi2-core xdotool x11-utils fonts-dejavu-core python3-gi gir1.2-gtk-3.0
      - run: bun install --cwd desktop --frozen-lockfile
      - if: runner.os != 'macOS'
        run: python scripts/desktop-prepare.py
      - if: runner.os == 'macOS'
        name: Package macOS
        run: python3 scripts/macos-release.py --target ${{ matrix.target }} --unsigned
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Breadcrumb-macOS-${{ matrix.target }}
          path: |
            build/macos-release/**/*.dmg
            build/macos-release/**/*.app.tar.gz
            build/macos-release/**/SHA256SUMS.txt
            build/macos-release/**/release.json
          if-no-files-found: error
          retention-days: 7
      - if: runner.os != 'macOS'
        run: cargo test --locked --manifest-path native/capture/Cargo.toml
      - if: runner.os == 'Linux'
        name: GLib iterator security regression (release mode)
        run: cargo test --release --manifest-path desktop/src-tauri/vendor/glib/Cargo.toml --lib variant_iter
      - if: runner.os == 'Linux'
        run: bun run --cwd desktop tauri build --no-bundle
      - if: runner.os == 'Windows'
        name: Build Windows NSIS installer
        run: bun run --cwd desktop tauri build --bundles nsis
      - if: runner.os == 'Windows'
        name: Build lightweight Windows update
        run: |
          New-Item build/windows-release -ItemType Directory -Force | Out-Null
          $version = (Get-Content desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $bundle = "desktop/src-tauri/target/release/bundle/nsis/Breadcrumb_${version}_x64-setup.exe"
          Move-Item $bundle build/windows-release/Breadcrumb-Windows-x64-setup.exe
          $config = (Resolve-Path desktop/src-tauri/tauri.update-windows.conf.json).Path
          bun run --cwd desktop tauri build --bundles nsis --config $config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item $bundle build/windows-release/Breadcrumb-Windows-x64-update.exe
      - if: runner.os == 'Windows'
        name: Windows installer lifecycle
        shell: pwsh
        run: |
          ./scripts/windows-installer-smoke.ps1 -Installer build/windows-release/Breadcrumb-Windows-x64-setup.exe -UpdateInstaller build/windows-release/Breadcrumb-Windows-x64-update.exe
      - name: Sign Windows update
        if: runner.os == 'Windows' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { Write-Host 'Update signing is not configured; keeping the installer unsigned.'; exit 0 }
          $version = (Get-Content desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          foreach ($installer in Get-ChildItem build/windows-release/*.exe) {
            bun run --cwd desktop tauri signer sign --app-version $version $installer.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Breadcrumb-Windows-x64-setup
          path: build/windows-release/*
          if-no-files-found: error
          retention-days: 7
      - if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session env WAYLAND_DISPLAY= XDG_SESSION_TYPE=x11 python3 scripts/linux-smoke.py
  ui:
    name: Desktop UI and Better Auth sync end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: engine/go.mod
          cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun install --cwd desktop --frozen-lockfile
      - run: bun install --cwd web --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test
      - run: bun run build:web
      - run: bun run test:sync
      - run: bun run test:dashboard
      - run: bun run test:integrations:web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ui-failure-screenshots
          path: |
            test-results/
            playwright-report/
          retention-days: 7
