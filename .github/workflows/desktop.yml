name: Desktop
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  engine:
    name: Local engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: engine/go.mod
          cache: false
      - if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" && go vet ./...
        working-directory: engine
      - run: go test -race ./...
        working-directory: engine
  desktop:
    name: Tauri + native adapter (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            native/capture
            desktop/src-tauri
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: engine/go.mod
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxcb1-dev libxcb-randr0-dev libxcb-xfixes0-dev libdbus-1-dev libpipewire-0.3-dev libgbm-dev libclang-dev libwayland-dev libxkbcommon-dev xvfb openbox xterm dbus-x11 at-spi2-core xdotool x11-utils fonts-dejavu-core python3-gi gir1.2-gtk-3.0
      - run: bun install --cwd desktop --frozen-lockfile
      - run: python scripts/desktop-prepare.py
      - if: runner.os != 'macOS'
        run: cargo test --locked --manifest-path native/capture/Cargo.toml
      - if: runner.os == 'Linux'
        name: GLib iterator security regression (release mode)
        run: cargo test --release --manifest-path desktop/src-tauri/vendor/glib/Cargo.toml --lib variant_iter
      - if: runner.os != 'Windows'
        run: bun run --cwd desktop tauri build --no-bundle
      - if: runner.os == 'Windows'
        name: Build Windows NSIS installer
        run: bun run --cwd desktop tauri build --bundles nsis
      - if: runner.os == 'Windows'
        name: Windows installer lifecycle
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          ./scripts/windows-installer-smoke.ps1 -Installer $installer.FullName
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Breadcrumb-Windows-x64-setup
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
      - if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session env WAYLAND_DISPLAY= XDG_SESSION_TYPE=x11 python3 scripts/linux-smoke.py
  ui:
    name: Desktop UI and Better Auth sync end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: engine/go.mod
          cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun install --cwd desktop --frozen-lockfile
      - run: bun install --cwd web --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test
      - run: bun run build:web
      - run: bun run test:sync
      - run: bun run test:dashboard
      - run: bun run test:profiles
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: ui-failure-screenshots
          path: |
            test-results/
            playwright-report/
          retention-days: 7
