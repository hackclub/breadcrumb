name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  javascript:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            directory: .
            command: bun run lint
            install: true
          - name: Formatting
            directory: .
            command: bun run format:check
            install: true
          - name: Desktop unit tests
            directory: desktop
            command: bun run test
            install: true
          - name: Web unit tests
            directory: web
            command: bun run test
            install: true
          - name: Web build
            directory: web
            command: bun run build
            install: true
          - name: Dependency audit (tooling)
            directory: .
            command: bun audit --audit-level high
          - name: Dependency audit (desktop)
            directory: desktop
            command: bun audit --audit-level high
          - name: Dependency audit (web)
            directory: web
            command: bun audit --audit-level high
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - if: matrix.install == true
        run: bun install --frozen-lockfile
      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}
  agents:
    name: Python agent tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s agents -p 'test_*.py'
  profiles:
    name: Profile reservations and privacy (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
        env:
          POSTGRES_USER: profile_test
          POSTGRES_DB: breadcrumb_profiles_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U profile_test -d breadcrumb_profiles_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --cwd web --frozen-lockfile
      - run: bun run --cwd web test:profiles
        env:
          PROFILE_TEST_DATABASE_URL: postgres://profile_test@127.0.0.1:5432/breadcrumb_profiles_test
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run build:web
      - run: bun run test:profiles
        env:
          PROFILE_TEST_DATABASE_URL: postgres://profile_test@127.0.0.1:5432/breadcrumb_profiles_test

  integrations:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API, MCP and screenshot sharing
            database: breadcrumb_api_test
            command: test:integrations
          - name: Leaderboard privacy and accounting
            database: breadcrumb_leaderboards_test
            command: test:leaderboards
    services:
      postgres:
        image: postgres:17-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
        env:
          POSTGRES_USER: integration_test
          POSTGRES_DB: ${{ matrix.database }}
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U integration_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --cwd web --frozen-lockfile
      - run: bun run --cwd web ${{ matrix.command }}
        env:
          INTEGRATIONS_TEST_DATABASE_URL: postgres://integration_test@127.0.0.1:5432/${{ matrix.database }}
          LEADERBOARD_TEST_DATABASE_URL: postgres://integration_test@127.0.0.1:5432/${{ matrix.database }}

  analytics:
    name: Analytics database parity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
        env:
          POSTGRES_USER: analytics_test
          POSTGRES_DB: breadcrumb_analytics_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U analytics_test -d breadcrumb_analytics_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server@sha256:4f491abc44d9f4a1747c033c35ddd5bc385521305d85ca8251ba0824ff597035
        env:
          CLICKHOUSE_USER: analytics_test
          CLICKHOUSE_PASSWORD: test-only
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["8123:8123"]
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "clickhouse-client --user analytics_test --password test-only --query 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --cwd web --frozen-lockfile
      - run: bun run --cwd web test:analytics
        env:
          ANALYTICS_TEST_POSTGRES_URL: postgres://analytics_test@127.0.0.1:5432/breadcrumb_analytics_test
          ANALYTICS_TEST_CLICKHOUSE_URL: http://127.0.0.1:8123
          ANALYTICS_TEST_CLICKHOUSE_USER: analytics_test
          ANALYTICS_TEST_CLICKHOUSE_PASSWORD: test-only
