name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  javascript:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            directory: .
            command: bun run lint
            install: true
          - name: Formatting
            directory: .
            command: bun run format:check
            install: true
          - name: Desktop unit tests
            directory: desktop
            command: bun run test
            install: true
          - name: Web unit tests
            directory: web
            command: bun run test
            install: true
          - name: Web build
            directory: web
            command: bun run build
            install: true
          - name: Dependency audit (tooling)
            directory: .
            command: bun audit --audit-level high
          - name: Dependency audit (desktop)
            directory: desktop
            command: bun audit --audit-level high
          - name: Dependency audit (web)
            directory: web
            command: bun audit --audit-level high
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - if: matrix.install == true
        run: bun install --frozen-lockfile
      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}
  agents:
    name: Python agent tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s agents -p 'test_*.py'
