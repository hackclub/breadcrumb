name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  web:
    name: Next.js + Bun + Oxc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun install --cwd web --frozen-lockfile
      - run: bun install --cwd desktop --frozen-lockfile
      - run: bun audit --audit-level high
      - run: bun audit --audit-level high
        working-directory: web
      - run: bun audit --audit-level high
        working-directory: desktop
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test:desktop
      - run: bun run test:web
      - run: bun run build:web
  agents:
    name: Python agent tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s agents -p 'test_*.py'
