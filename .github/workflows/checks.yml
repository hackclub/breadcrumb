name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  javascript:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            directory: .
            command: bun run lint
            install: true
          - name: Formatting
            directory: .
            command: bun run format:check
            install: true
          - name: Desktop unit tests
            directory: desktop
            command: bun run test
            install: true
          - name: Web unit tests
            directory: web
            command: bun run test
            install: true
          - name: Web build
            directory: web
            command: bun run build
            install: true
          - name: Dependency audit (tooling)
            directory: .
            command: bun audit --audit-level high
          - name: Dependency audit (desktop)
            directory: desktop
            command: bun audit --audit-level high
          - name: Dependency audit (web)
            directory: web
            command: bun audit --audit-level high
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - if: matrix.install == true
        run: bun install --frozen-lockfile
      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}
  agents:
    name: Python agent tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s agents -p 'test_*.py'
  profiles:
    name: Profile reservations and privacy (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
        env:
          POSTGRES_USER: profile_test
          POSTGRES_DB: breadcrumb_profiles_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U profile_test -d breadcrumb_profiles_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --cwd web --frozen-lockfile
      - run: bun run --cwd web test:profiles
        env:
          PROFILE_TEST_DATABASE_URL: postgres://profile_test@127.0.0.1:5432/breadcrumb_profiles_test
