name: Release
# Builds, signs and publishes the desktop app version in tauri.conf.json to the
# windows-preview release. Start it by hand from main after the version bump merges.
on:
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  windows:
    name: Windows
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            native/capture
            desktop/src-tauri
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: engine/go.mod
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --cwd desktop --frozen-lockfile
      - run: python scripts/desktop-prepare.py
      - name: Build installer and lightweight update
        run: |
          New-Item build/windows-release -ItemType Directory -Force | Out-Null
          $version = (Get-Content desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $bundle = "desktop/src-tauri/target/release/bundle/nsis/Breadcrumb_${version}_x64-setup.exe"
          bun run --cwd desktop tauri build --bundles nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item $bundle build/windows-release/Breadcrumb-Windows-x64-setup.exe
          $config = (Resolve-Path desktop/src-tauri/tauri.update-windows.conf.json).Path
          bun run --cwd desktop tauri build --bundles nsis --config $config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item $bundle build/windows-release/Breadcrumb-Windows-x64-update.exe
      - name: Installer lifecycle
        shell: pwsh
        run: ./scripts/windows-installer-smoke.ps1 -Installer build/windows-release/Breadcrumb-Windows-x64-setup.exe -UpdateInstaller build/windows-release/Breadcrumb-Windows-x64-update.exe
      - name: Sign updates
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'TAURI_SIGNING_PRIVATE_KEY is required for releases' }
          $version = (Get-Content desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          foreach ($installer in Get-ChildItem build/windows-release/*.exe) {
            bun run --cwd desktop tauri signer sign --app-version $version $installer.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: build/windows-release/*
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS ${{ matrix.name }}
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-latest, name: "Apple Silicon", target: aarch64-apple-darwin }
          - { os: macos-26-intel, name: Intel, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    outputs:
      built: ${{ steps.keychain.outputs.configured }}
    steps:
      # A public Mac build needs the Developer ID certificate. Without it, the release keeps
      # the Mac packages already attached for this version: an ad-hoc signature would
      # change the app's identity and macOS would drop its Screen Recording permission.
      - name: Import Developer ID certificate
        id: keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::notice::APPLE_CERTIFICATE is not configured; using the Mac packages already on the release."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - if: steps.keychain.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.keychain.outputs.configured == 'true'
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}
      - if: steps.keychain.outputs.configured == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            native/capture
            desktop/src-tauri
      - if: steps.keychain.outputs.configured == 'true'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: engine/go.mod
          cache: false
      - if: steps.keychain.outputs.configured == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - if: steps.keychain.outputs.configured == 'true'
        run: bun install --cwd desktop --frozen-lockfile
      - if: steps.keychain.outputs.configured == 'true'
        name: Build, sign and package
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          notarize=--skip-notarization
          if [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY" ]; then
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
            notarize=
          fi
          python3 scripts/macos-release.py --target ${{ matrix.target }} $notarize
          rm -f "$RUNNER_TEMP/AuthKey.p8"
      - if: steps.keychain.outputs.configured == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos-${{ matrix.target }}
          path: |
            build/macos-release/**/*.dmg
            build/macos-release/**/*.app.tar.gz
            build/macos-release/**/*.app.tar.gz.sig
            build/macos-release/**/release.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE: windows-preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile && bun install --cwd web --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: build/artifacts
          merge-multiple: true
      - name: Publish assets, checksums and update feed
        run: bash scripts/desktop-publish.sh build/artifacts
