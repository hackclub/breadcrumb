version: 2
updates:
  - package-ecosystem: bun
    directories: ["/", "/desktop", "/web"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      javascript:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /engine
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: cargo
    directories: ["/desktop/src-tauri", "/native/capture"]
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
